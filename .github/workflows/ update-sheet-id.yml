name: Update schedule sheet ID

# Раз в ~20 минут заходит на koop41.ru/schedule, достаёт ID Google-таблицы "Очная форма"
# и, если он изменился, коммитит его в sheet-id.json. Сайт читает этот файл при загрузке.
on:
  schedule:
    - cron: "*/59 * * * *" 
  workflow_dispatch: {}   # можно запустить вручную: вкладка Actions → Run workflow

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch current sheet ID from koop41.ru
        env:
          # Если index.html лежит не в корне репозитория, поменяй путь (например, docs/sheet-id.json)
          OUT_PATH: sheet-id.json
        run: |
          import html as htmllib
          import json
          import os
          import re
          import sys
          import urllib.request
          from datetime import datetime, timezone

          PAGE_URL = "https://koop41.ru/schedule"
          OUT_PATH = os.environ.get("OUT_PATH", "sheet-id.json")
          ID_RE = re.compile(r"/(?:spreadsheets|file)/d/([A-Za-z0-9_-]{20,})")


          def fetch_page():
              if os.environ.get("PAGE_FILE"):  # для локальной проверки
                  return open(os.environ["PAGE_FILE"], encoding="utf-8").read()
              req = urllib.request.Request(PAGE_URL, headers={"User-Agent": "Mozilla/5.0 (schedule-sync)"})
              return urllib.request.urlopen(req, timeout=30).read().decode("utf-8", "replace")


          def find_sheet_id(page):
              # 1) ссылка, текст которой "Очная форма" (а не "Очно-заочная форма")
              for m in re.finditer(r'<a\b[^>]*?href="([^"]+)"[^>]*>(.*?)</a>', page, re.S | re.I):
                  text = " ".join(htmllib.unescape(re.sub(r"<[^>]+>", " ", m.group(2))).split())
                  if re.search(r"(?<![а-яё])очная\s+форма", text, re.I) and not re.search(r"заочн", text, re.I):
                      found = ID_RE.search(htmllib.unescape(m.group(1)))
                      if found:
                          return found.group(1)
              # 2) запасной вариант: ближайшая к надписи "Очная форма" ссылка на таблицу/файл
              labels = [m.start() for m in re.finditer(r"(?<![а-яё])очная\s+форма", page, re.I)]
              ids = [(m.start(), m.group(1)) for m in ID_RE.finditer(page)]
              if labels and ids:
                  return min(ids, key=lambda p: min(abs(p[0] - l) for l in labels))[1]
              return None


          page = fetch_page()
          sheet_id = find_sheet_id(page)
          if not sheet_id:
              sys.exit("Не нашёл ссылку 'Очная форма' на koop41.ru/schedule — возможно, изменилась вёрстка страницы")

          old_id = None
          if os.path.exists(OUT_PATH):
              try:
                  old_id = json.load(open(OUT_PATH, encoding="utf-8")).get("id")
              except Exception:
                  pass

          if sheet_id == old_id:
              print("ID не изменился:", sheet_id)
          else:
              with open(OUT_PATH, "w", encoding="utf-8") as f:
                  json.dump({"id": sheet_id, "updatedAt": datetime.now(timezone.utc).isoformat(timespec="seconds")}, f, ensure_ascii=False, indent=2)
                  f.write("\n")
              print("Новый ID:", sheet_id, "(был:", old_id, ")")

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sheet-id.json
          git diff --cached --quiet || (git commit -m "Update schedule sheet ID" && git push)