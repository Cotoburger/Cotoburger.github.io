name: Обновить панель PineappleCat

# Раз в ~5 минут забираем снимок состояния сервера SaveBot по SSH
# и коммитим его в PineappleCat/status.json — сайт читает этот файл.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}   # вручную: Actions → Run workflow

permissions:
  contents: write

concurrency:
  group: pineapplecat-status
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Подготовить SSH-ключ
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Отпечаток сервера подставляем автоматически (порт снаружи проброшен
          # через NAT, поэтому ключ берём с самого сервера).
          ssh-keyscan -p 42781 194.87.52.3 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Собрать снимок состояния сервера
        run: |
          set -euo pipefail
          scp -P 42781 .github/scripts/pineapplecat_status.py \
              root@194.87.52.3:/tmp/pineapplecat_status.py
          ssh -p 42781 root@194.87.52.3 \
            "python3 /tmp/pineapplecat_status.py --base /root/SaveBot > /tmp/status.json && rm -f /tmp/pineapplecat_status.py"

          scp -P 42781 root@194.87.52.3:/tmp/status.json PineappleCat/status.json
          python3 -c "import json;d=json.load(open('PineappleCat/status.json'));print('снимок от',d['generated_at_local'])"

      - name: Закоммитить, если изменилось
        run: |
          set -euo pipefail
          if git diff --quiet -- PineappleCat/status.json; then
            echo "Данные не изменились — коммит не нужен"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PineappleCat/status.json
          git commit -m "Auto update PineappleCat status"
          git push
