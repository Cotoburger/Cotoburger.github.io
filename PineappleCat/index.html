<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0d1117">
<meta name="description" content="Панель состояния SaveBot: память, диск, CPU, аптайм, сервисы и пользователи бота.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SaveBot">
<meta name="format-detection" content="telephone=no">
<title>SaveBot — панель</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="bg-grid" aria-hidden="true"></div>

<header class="topbar">
  <div class="wrap topbar-in">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2 4 5.5v6c0 5 3.4 9.2 8 10.5 4.6-1.3 8-5.5 8-10.5v-6L12 2Z"/>
          <circle cx="12" cy="11" r="2.6"/>
        </svg>
      </span>
      <div class="brand-txt">
        <h1>SaveBot</h1>
        <p id="host">панель состояния</p>
      </div>
    </div>
    <button id="refresh" class="btn-refresh" type="button" aria-label="Обновить данные">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/>
      </svg>
      <span>Обновить</span>
    </button>
  </div>
</header>

<main class="wrap">

  <!-- ── общая сводка ── -->
  <section class="hero" id="hero">
    <div class="hero-ring" id="ring" style="--pct:0">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <circle class="ring-bg" cx="60" cy="60" r="52"/>
        <circle class="ring-fg" cx="60" cy="60" r="52"/>
      </svg>
      <div class="hero-ring-txt">
        <b id="ringVal">—</b>
        <span>память</span>
      </div>
    </div>
    <div class="hero-info">
      <div class="hero-state" id="botState"><i class="dot"></i><span>проверка…</span></div>
      <p class="hero-sub" id="heroSub">собираем данные с сервера</p>
      <dl class="hero-stats">
        <div><dt>Аптайм сервера</dt><dd id="srvUptime">—</dd></div>
        <div><dt>Аптайм бота</dt><dd id="botUptime">—</dd></div>
        <div><dt>Обновлено</dt><dd id="updated">—</dd></div>
      </dl>
    </div>
  </section>

  <!-- ── метрики ── -->
  <h2 class="sec-title">Ресурсы</h2>
  <section class="grid resources-grid">
    <article class="card">
      <header><span class="ic ic-mem" aria-hidden="true"></span><h3>ОЗУ</h3></header>
      <div class="val" id="memVal">—</div>
      <div class="sub" id="memSub">—</div>
      <div class="bar"><i id="memBar" style="width:0%"></i></div>
    </article>

    <article class="card">
      <header><span class="ic ic-swap" aria-hidden="true"></span><h3>Swap</h3></header>
      <div class="val" id="swapVal">—</div>
      <div class="sub" id="swapSub">—</div>
      <div class="bar"><i id="swapBar" style="width:0%"></i></div>
    </article>

    <article class="card">
      <header><span class="ic ic-disk" aria-hidden="true"></span><h3>Диск</h3></header>
      <div class="val" id="diskVal">—</div>
      <div class="sub" id="diskSub">—</div>
      <div class="bar"><i id="diskBar" style="width:0%"></i></div>
    </article>

    <article class="card">
      <header><span class="ic ic-cpu" aria-hidden="true"></span><h3>CPU</h3></header>
      <div class="val" id="cpuVal">—</div>
      <div class="sub" id="cpuSub">—</div>
      <div class="bar"><i id="cpuBar" style="width:0%"></i></div>
    </article>
  </section>

  <!-- ── сервисы ── -->
  <h2 class="sec-title">Сервисы</h2>
  <section class="grid grid-2" id="services"></section>

  <!-- ── бот ── -->
  <h2 class="sec-title">Бот</h2>
  <section class="grid grid-2">
    <article class="card">
      <header><span class="ic ic-bot" aria-hidden="true"></span><h3>Процесс</h3></header>
      <div class="val" id="botRss">—</div>
      <div class="sub" id="botProcSub">—</div>
    </article>
    <article class="card">
      <header><span class="ic ic-db" aria-hidden="true"></span><h3>Хранилище</h3></header>
      <div class="val" id="dbSize">—</div>
      <div class="sub" id="dbSub">—</div>
    </article>
  </section>

  <!-- ── пользователи ── -->
  <h2 class="sec-title">Пользователи бота</h2>
  <section class="card card-list">
    <div class="users" id="users"></div>
  </section>

  <footer class="foot">
    <p>Данные обновляет GitHub Actions · <span id="genAt">—</span></p>
  </footer>
</main>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="assets/app.js"></script>
</body>
</html>
